# Star Local — LOKALE ONTWIKKELING (wrangler.toml)
# Productie: gebruik wrangler.prod.toml — NIET deze file voor deploy.
# Zie docs/cloudflare-production-checklist.md

name = "star-local"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Development D1 (local: wrangler d1 migrations apply star-local-saas-dev --local)
# Production database_id is intentionally not configured in this phase.
[[d1_databases]]
binding = "DB"
database_name = "star-local-saas-prod"
database_id = "d58a4699-131e-403d-8ea7-65ef928a72d7"
migrations_dir = "migrations"

# Development R2 (local: wrangler r2 object put/get against star-local-saas-media-dev)
# Production bucket_name is intentionally dev-only in this phase.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "star-local-saas-media-dev"
